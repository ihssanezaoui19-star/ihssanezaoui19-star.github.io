<?xml version="1.0" encoding="UTF-8"?>
<svg class="architecture-svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-label="Active Directory · audit, détection et correction" xmlns="http://www.w3.org/2000/svg">
<style>
svg{background:#fff;font-family:Arial,Helvetica,sans-serif}
.arch-zone rect{fill:#f4f8fa;stroke:#b9ccd7;stroke-width:1.5;stroke-dasharray:6 5}
.arch-zone-hostile rect{fill:#fff3f0;stroke:#f0b9af}
.arch-zone-observe rect{fill:#edf8f8;stroke:#a9d9da}
.arch-zone-planned rect{fill:#fbf7ee;stroke:#d6c9aa}
.arch-zone text{font:500 15px 'DejaVu Sans Mono',monospace;fill:#305777}
.arch-edge{fill:none;stroke:#829cad;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.arch-edge-hostile{stroke:#e44c3d}
.arch-edge-telemetry{stroke:#0998a0;stroke-dasharray:6 5}
.arch-edge-planned{stroke:#b48a54;stroke-dasharray:6 5}
.arch-marker-flow path{fill:#829cad}
.arch-marker-hostile path{fill:#e44c3d}
.arch-marker-telemetry path{fill:#0998a0}
.arch-marker-planned path{fill:#b48a54}
.arch-card-face{fill:#fff;stroke:#bed0dc;stroke-width:1.6}
.arch-card-dark .arch-card-face{fill:#0e2738;stroke:#0e2738}
.arch-card-observe .arch-card-face{stroke:#04959e;stroke-width:1.9}
.arch-card-risk .arch-card-face{stroke:#e2b2aa}
.arch-card-planned .arch-card-face{stroke:#bc9b66;stroke-dasharray:6 5}
.arch-icon-disc{fill:#e2ecf2}
.arch-card-risk .arch-icon-disc{fill:#ffe2dc}
.arch-card-observe .arch-icon-disc{fill:#d9f1f0}
.arch-card-dark .arch-icon-disc{fill:#355062}
.arch-card-planned .arch-icon-disc{fill:#f4ead3}
.arch-icon{font:700 13px Arial,sans-serif;fill:#12394e}
.arch-card-risk .arch-icon{fill:#e44c3d}
.arch-card-observe .arch-icon{fill:#047f88}
.arch-card-dark .arch-icon{fill:#fff}
.arch-title{font:700 17px Arial,sans-serif;fill:#071d30}
.arch-card-dark .arch-title{fill:#fff}
.arch-sub{font:12px 'DejaVu Sans Mono',monospace;fill:#3d6383}
.arch-card-dark .arch-sub{fill:#91cafa}
.arch-step-disc{fill:#0b283c}
.arch-step{fill:#fff;font:700 11px 'DejaVu Sans Mono',monospace}
.arch-edge-label{fill:#087e88;font:12px 'DejaVu Sans Mono',monospace}
</style>

          <defs><marker id="arch-arrow-05-flow" class="arch-marker-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-05-hostile" class="arch-marker-hostile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-05-telemetry" class="arch-marker-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-05-planned" class="arch-marker-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
          <g class="arch-zone arch-zone-neutral"><rect x="18" y="64" width="254" height="544" rx="16"/><text x="38" y="95">Cas client simulé</text></g><g class="arch-zone arch-zone-observe"><rect x="296" y="64" width="254" height="544" rx="16"/><text x="316" y="95">Audit et observation</text></g><g class="arch-zone arch-zone-neutral"><rect x="574" y="64" width="608" height="544" rx="16"/><text x="594" y="95">Décision et correction</text></g>
          <g class="arch-edges"><path class="arch-edge arch-edge-flow" d="M250 300 H282 V190 H318" marker-end="url(#arch-arrow-05-flow)"/><path class="arch-edge arch-edge-telemetry" d="M250 300 H282 V410 H318" marker-end="url(#arch-arrow-05-telemetry)"/><path class="arch-edge arch-edge-flow" d="M528 190 H598" marker-end="url(#arch-arrow-05-flow)"/><path class="arch-edge arch-edge-telemetry" d="M528 410 H561 V270 H722 V235" marker-end="url(#arch-arrow-05-telemetry)"/><path class="arch-edge arch-edge-flow" d="M846 190 H902" marker-end="url(#arch-arrow-05-flow)"/><path class="arch-edge arch-edge-flow" d="M1026 235 V365" marker-end="url(#arch-arrow-05-flow)"/></g>
          <g class="arch-card arch-card-plain" aria-label="Domaine AD : La maquette reproduit un cas client, sans exposer ses données réelles." transform="translate(40 255)">
      <rect class="arch-card-face" width="210" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">AD</text>
      <text class="arch-title"><tspan x="60" y="40">Domaine AD</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Proxmox · DNS · postes</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">01</text>
    </g><g class="arch-card arch-card-risk" aria-label="PingCastle : L’audit initial sert à prioriser les écarts de configuration." transform="translate(318 145)">
      <rect class="arch-card-face" width="210" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">95</text>
      <text class="arch-title"><tspan x="60" y="40">PingCastle</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Audit initial · 95/100</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">02</text>
    </g><g class="arch-card arch-card-observe" aria-label="Wazuh + Sysmon : Des scénarios autorisés vérifient la visibilité des événements et alertes." transform="translate(318 365)">
      <rect class="arch-card-face" width="210" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">SOC</text>
      <text class="arch-title"><tspan x="60" y="40">Wazuh + Sysmon</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Tests d’alerte contrôlés</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">03</text>
    </g><g class="arch-card arch-card-plain" aria-label="Analyse d’impact : Les conséquences système sont évaluées avant tout durcissement." transform="translate(598 145)">
      <rect class="arch-card-face" width="248" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">?</text>
      <text class="arch-title"><tspan x="60" y="40">Analyse d’impact</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Usages et dépendances</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">04</text>
    </g><g class="arch-card arch-card-dark" aria-label="Corrections : Les changements ciblés sont faits en PowerShell ou dans les consoles selon leur impact." transform="translate(902 145)">
      <rect class="arch-card-face" width="248" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">PS</text>
      <text class="arch-title"><tspan x="60" y="40">Corrections</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">PowerShell ou AD/GPO</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">05</text>
    </g><g class="arch-card arch-card-observe" aria-label="Nouvel audit : Le nouvel audit montre une baisse du score de risque en laboratoire ; des écarts restent possibles." transform="translate(902 365)">
      <rect class="arch-card-face" width="248" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">20</text>
      <text class="arch-title"><tspan x="60" y="40">Nouvel audit</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">PingCastle · 20/100</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">06</text>
    </g>
        </svg>
