<?xml version="1.0" encoding="UTF-8"?>
<svg class="architecture-svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-label="Datacenter · plan du laboratoire VMware" xmlns="http://www.w3.org/2000/svg">
<style>
svg{background:#fff;font-family:Arial,Helvetica,sans-serif}
.arch-zone rect{fill:#f4f8fa;stroke:#b9ccd7;stroke-width:1.5;stroke-dasharray:6 5}
.arch-zone-hostile rect{fill:#fff3f0;stroke:#f0b9af}
.arch-zone-observe rect{fill:#edf8f8;stroke:#a9d9da}
.arch-zone-planned rect{fill:#fbf7ee;stroke:#d6c9aa}
.arch-zone text{font:500 15px 'DejaVu Sans Mono',monospace;fill:#305777}
.arch-edge{fill:none;stroke:#829cad;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.arch-edge-hostile{stroke:#e44c3d}
.arch-edge-telemetry{stroke:#0998a0;stroke-dasharray:6 5}
.arch-edge-planned{stroke:#b48a54;stroke-dasharray:6 5}
.arch-marker-flow path{fill:#829cad}
.arch-marker-hostile path{fill:#e44c3d}
.arch-marker-telemetry path{fill:#0998a0}
.arch-marker-planned path{fill:#b48a54}
.arch-card-face{fill:#fff;stroke:#bed0dc;stroke-width:1.6}
.arch-card-dark .arch-card-face{fill:#0e2738;stroke:#0e2738}
.arch-card-observe .arch-card-face{stroke:#04959e;stroke-width:1.9}
.arch-card-risk .arch-card-face{stroke:#e2b2aa}
.arch-card-planned .arch-card-face{stroke:#bc9b66;stroke-dasharray:6 5}
.arch-icon-disc{fill:#e2ecf2}
.arch-card-risk .arch-icon-disc{fill:#ffe2dc}
.arch-card-observe .arch-icon-disc{fill:#d9f1f0}
.arch-card-dark .arch-icon-disc{fill:#355062}
.arch-card-planned .arch-icon-disc{fill:#f4ead3}
.arch-icon{font:700 13px Arial,sans-serif;fill:#12394e}
.arch-card-risk .arch-icon{fill:#e44c3d}
.arch-card-observe .arch-icon{fill:#047f88}
.arch-card-dark .arch-icon{fill:#fff}
.arch-title{font:700 17px Arial,sans-serif;fill:#071d30}
.arch-card-dark .arch-title{fill:#fff}
.arch-sub{font:12px 'DejaVu Sans Mono',monospace;fill:#3d6383}
.arch-card-dark .arch-sub{fill:#91cafa}
.arch-step-disc{fill:#0b283c}
.arch-step{fill:#fff;font:700 11px 'DejaVu Sans Mono',monospace}
.arch-edge-label{fill:#087e88;font:12px 'DejaVu Sans Mono',monospace}
</style>

          <defs><marker id="arch-arrow-02-flow" class="arch-marker-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-02-hostile" class="arch-marker-hostile" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-02-telemetry" class="arch-marker-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker><marker id="arch-arrow-02-planned" class="arch-marker-planned" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z"/></marker></defs>
          <g class="arch-zone arch-zone-neutral"><rect x="18" y="64" width="260" height="544" rx="16"/><text x="38" y="95">Conception</text></g><g class="arch-zone arch-zone-neutral"><rect x="300" y="64" width="574" height="544" rx="16"/><text x="320" y="95">Laboratoire VMware</text></g><g class="arch-zone arch-zone-planned"><rect x="896" y="64" width="286" height="544" rx="16"/><text x="916" y="95">Validation prévue</text></g>
          <g class="arch-edges"><path class="arch-edge arch-edge-flow" d="M258 280 H326" marker-end="url(#arch-arrow-02-flow)"/><path class="arch-edge arch-edge-flow" d="M564 184 H604" marker-end="url(#arch-arrow-02-flow)"/><path class="arch-edge arch-edge-flow" d="M445 229 V365" marker-end="url(#arch-arrow-02-flow)"/><path class="arch-edge arch-edge-flow" d="M564 410 H604" marker-end="url(#arch-arrow-02-flow)"/><path class="arch-edge arch-edge-planned" d="M848 184 H922" marker-end="url(#arch-arrow-02-planned)"/><path class="arch-edge arch-edge-planned" d="M848 410 H922" marker-end="url(#arch-arrow-02-planned)"/><path class="arch-edge arch-edge-planned" d="M1038 229 V365" marker-end="url(#arch-arrow-02-planned)"/></g>
          <g class="arch-card arch-card-plain" aria-label="Scénario : Le scénario décrit les services et leurs dépendances avant le montage." transform="translate(38 235)">
      <rect class="arch-card-face" width="220" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">01</text>
      <text class="arch-title"><tspan x="60" y="40">Scénario</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Entreprise fictive</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">01</text>
    </g><g class="arch-card arch-card-plain" aria-label="VMware Workstation : Les machines et réseaux sont préparés progressivement dans VMware Workstation Pro." transform="translate(326 139)">
      <rect class="arch-card-face" width="238" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">VM</text>
      <text class="arch-title"><tspan x="60" y="40">VMware Workstation</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Socle de la maquette</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">02</text>
    </g><g class="arch-card arch-card-observe" aria-label="Réseaux virtuels : La segmentation du laboratoire reste en construction et doit être testée." transform="translate(604 139)">
      <rect class="arch-card-face" width="244" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">NET</text>
      <text class="arch-title"><tspan x="60" y="40">Réseaux virtuels</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Isolation en construction</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">03</text>
    </g><g class="arch-card arch-card-plain" aria-label="Machines virtuelles : Les VMs représentent les services de l’entreprise fictive." transform="translate(326 365)">
      <rect class="arch-card-face" width="238" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">VM</text>
      <text class="arch-title"><tspan x="60" y="40">Machines</tspan><tspan x="60" y="57">virtuelles</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Services simulés</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">04</text>
    </g><g class="arch-card arch-card-plain" aria-label="Dépendances : L’objectif est d’identifier ce qui devient indisponible quand un composant tombe." transform="translate(604 365)">
      <rect class="arch-card-face" width="244" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">↔</text>
      <text class="arch-title"><tspan x="60" y="40">Dépendances</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Points uniques à repérer</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">05</text>
    </g><g class="arch-card arch-card-planned" aria-label="Tests de panne : Les coupures et temps de bascule ne sont pas encore publiés comme résultats." transform="translate(922 139)">
      <rect class="arch-card-face" width="232" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">!</text>
      <text class="arch-title"><tspan x="60" y="40">Tests de panne</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Bascule à mesurer</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">06</text>
    </g><g class="arch-card arch-card-planned" aria-label="Reprise / PRA : La reprise doit être vérifiée après construction de la maquette complète." transform="translate(922 365)">
      <rect class="arch-card-face" width="232" height="90" rx="10"/>
      <circle class="arch-icon-disc" cx="29" cy="34" r="21"/><text class="arch-icon" x="29" y="39" text-anchor="middle">DR</text>
      <text class="arch-title"><tspan x="60" y="40">Reprise / PRA</tspan></text>
      <text class="arch-sub"><tspan x="17" y="70">Vérification à venir</tspan></text>
      <circle class="arch-step-disc" cx="0" cy="0" r="13"/><text class="arch-step" x="0" y="4" text-anchor="middle">07</text>
    </g>
        </svg>
